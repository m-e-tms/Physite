<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
   <link rel="stylesheet" href="test.css">
   
</head>
<body>
 <div class="card">
        <div class="widget">
    <h1>Unelastischer Stoß</h1>
    
<canvas id="myCanvas" width="1920px" height="1080px"></canvas>
 </div>
</div>
</body>

<script>
const canvas= document.getElementById('myCanvas');
const ctx    = canvas.getContext('2d');

canvas.width  = 800;
canvas.height = 480;

// ================================================================
// KONSTANTEN & ZOOM
// ================================================================
let PIXELS_PER_METER = 80;
const RADIUS_M  = 0.30;
const MIN_SCALE = 30;
const MAX_SCALE = 250;

const SIM_HEIGHT  = 220;
const INFO_HEIGHT = 130;
const BTN_HEIGHT  = 60;

// ================================================================
// PHYSIK – Vollkommen unelastischer Stoß
// ================================================================
function createBody(mass, position, velocity) {
  return { mass, position, velocity,
           initPos: position, initVel: velocity, radius: RADIUS_M };
}

function updatePosition(body, dt) {
  body.position += body.velocity * dt;
}

function isColliding(b1, b2) {
  return Math.abs(b2.position - b1.position) <= b1.radius + b2.radius;
}

function areApproaching(b1, b2) {
  return (b2.velocity - b1.velocity) * (b2.position - b1.position) < 0;
}

// Nach Stoß: gemeinsame Geschwindigkeit v' = (m1*v1 + m2*v2) / (m1 + m2)
// Impulserhaltung: m1*v1 + m2*v2 = (m1+m2)*v'
function applyInelasticCollision(b1, b2) {
  const mSum = b1.mass + b2.mass;
  const vCommon = (b1.mass * b1.velocity + b2.mass * b2.velocity) / mSum;
  b1.velocity = vCommon;
  b2.velocity = vCommon;
  // Körper "verkleben": gemeinsame kombinierte Masse ab jetzt
  // (physikalisch: sie bewegen sich als ein System)
}

// Kinetische Energie: Ek = 0.5 * m * v^2
function kineticEnergy(b) { return 0.5 * b.mass * b.velocity ** 2; }
function momentum(b)      { return b.mass * b.velocity; }

// Energieverlust ΔE = Ek_vor - Ek_nach
// ΔE = m1*m2 / (2*(m1+m2)) * (v1-v2)^2  [analytisch]
function deltaE_analytic(m1, v1, m2, v2) {
  return (m1 * m2) / (2 * (m1 + m2)) * Math.pow(v1 - v2, 2);
}

// ================================================================
// KOORDINATENUMRECHNUNG
// ================================================================
function physToScreenX(physX) {
  return canvas.width / 2 + physX * PIXELS_PER_METER;
}

function screenToPhysX(screenX) {
  return (screenX - canvas.width / 2) / PIXELS_PER_METER;
}

function mToPx(meters) {
  return meters * PIXELS_PER_METER;
}

// ================================================================
// MODELL – Parameter intern verwaltet
// ================================================================
let params = { m1: 2.0, v1: 3.0, m2: 1.0, v2: -1.0 };

let body1 = createBody(params.m1, -3.0, params.v1);
let body2 = createBody(params.m2,  3.0, params.v2);
let collisionProcessed = false;
let collisionOccurred  = false;

// Zustand vor/nach Stoß für Info-Anzeige
let preCollision  = null;
let postCollision = null;

function setParams(m1, v1, m2, v2) {
  params = { m1, v1, m2, v2 };
  body1 = createBody(m1, body1.initPos, v1);
  body2 = createBody(m2, body2.initPos, v2);
  collisionProcessed = false;
  collisionOccurred  = false;
  preCollision  = null;
  postCollision = null;
}

// ================================================================
// SIMULATIONS-UPDATE
// ================================================================
function simulationStep(dt) {
  updatePosition(body1, dt);
  updatePosition(body2, dt);

  if (isColliding(body1, body2)) {
    if (!collisionProcessed && areApproaching(body1, body2)) {
      // Zustand VOR Stoß speichern
      preCollision = {
        p1: momentum(body1), p2: momentum(body2),
        Ek1: kineticEnergy(body1), Ek2: kineticEnergy(body2),
        v1: body1.velocity, v2: body2.velocity,
        m1: body1.mass,     m2: body2.mass
      };

      applyInelasticCollision(body1, body2);

      // Zustand NACH Stoß speichern
      const vPrime  = body1.velocity;
      const mSum    = body1.mass + body2.mass;
      const EkNach  = 0.5 * mSum * vPrime ** 2;
      const dE      = deltaE_analytic(
        preCollision.m1, preCollision.v1,
        preCollision.m2, preCollision.v2
      );
      postCollision = {
        vPrime, mSum, EkNach, dE,
        pNach: mSum * vPrime
      };

      collisionProcessed = true;
      collisionOccurred  = true;
    }
  } else {
    collisionProcessed = false;
  }
}

// ================================================================
// CANVAS BUTTONS
// ================================================================
const btnStart = { label: 'Start',     x: 0, y: 0, w: 110, h: 34 };
const btnReset = { label: 'Reset',     x: 0, y: 0, w: 110, h: 34 };
const btnSetM1 = { label: 'm₁ setzen', x: 0, y: 0, w: 110, h: 34 };
const btnSetM2 = { label: 'm₂ setzen', x: 0, y: 0, w: 110, h: 34 };

function layoutButtons() {
  const cy = SIM_HEIGHT + INFO_HEIGHT + BTN_HEIGHT / 2;
  const totalW = 4 * 110 + 3 * 12;
  const startX = (canvas.width - totalW) / 2;
  btnSetM1.x = startX;        btnSetM1.y = cy - 17;
  btnSetM2.x = startX + 122;  btnSetM2.y = cy - 17;
  btnStart.x  = startX + 244; btnStart.y  = cy - 17;
  btnReset.x  = startX + 366; btnReset.y  = cy - 17;
}

function drawButton(btn, bgColor) {
  ctx.fillStyle = bgColor;
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 5);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
}

function isInsideButton(btn, mx, my) {
  return mx >= btn.x && mx <= btn.x + btn.w &&
         my >= btn.y && my <= btn.y + btn.h;
}

// ================================================================
// INFO-PANEL: Impuls- & Energiebilanz im Canvas
// ================================================================
function drawInfoPanel() {
  const y0 = SIM_HEIGHT;
  const W  = canvas.width;

  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, y0, W, INFO_HEIGHT);

  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, y0 + INFO_HEIGHT); ctx.lineTo(W, y0 + INFO_HEIGHT); ctx.stroke();

  const f  = v => (v >= 0 ? '+' : '') + v.toFixed(3);
  const fe = v => v.toFixed(3);

  if (!collisionOccurred || !preCollision || !postCollision) {
    // ── Vor dem Stoß: laufende Werte ──────────────────────────
    const p1   = momentum(body1);
    const p2   = momentum(body2);
    const ptot = p1 + p2;
    const Ek1  = kineticEnergy(body1);
    const Ek2  = kineticEnergy(body2);
    const Ek   = Ek1 + Ek2;
    const dE_preview = deltaE_analytic(body1.mass, body1.velocity, body2.mass, body2.velocity);

    // Formelzeile
    ctx.font = '10px monospace';
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'left';
    ctx.fillText('p = m·v', 28, y0 + 18);
    ctx.fillText('p_ges = p₁+p₂ (erhalten!)', 168, y0 + 18);
    ctx.fillText("Eₖ = ½·m·v²", 430, y0 + 18);
    ctx.fillText("v' = (m₁v₁+m₂v₂)/(m₁+m₂)", 580, y0 + 18);

    ctx.font = 'bold 11px monospace';
    // K1 blau
    ctx.fillStyle = '#3366cc';
    ctx.fillText(`p₁ = ${body1.mass.toFixed(1)}·(${f(body1.velocity)}) = ${f(p1)} kg·m/s`, 28, y0 + 40);
    ctx.fillText(`Eₖ₁ = ½·${body1.mass.toFixed(1)}·(${f(body1.velocity)})² = ${fe(Ek1)} J`, 430, y0 + 40);
    // K2 rot
    ctx.fillStyle = '#cc4400';
    ctx.fillText(`p₂ = ${body2.mass.toFixed(1)}·(${f(body2.velocity)}) = ${f(p2)} kg·m/s`, 28, y0 + 60);
    ctx.fillText(`Eₖ₂ = ½·${body2.mass.toFixed(1)}·(${f(body2.velocity)})² = ${fe(Ek2)} J`, 430, y0 + 60);
    // Summen
    ctx.fillStyle = '#222';
    ctx.fillText(`p_ges = ${f(p1)} + (${f(p2)}) = ${f(ptot)} kg·m/s`, 28, y0 + 82);
    ctx.fillText(`Eₖ_ges = ${fe(Ek1)} + ${fe(Ek2)} = ${fe(Ek)} J`, 430, y0 + 82);
    // ΔE-Vorschau
    ctx.fillStyle = '#886600';
    ctx.font = '10px monospace';
    ctx.fillText(`→ Bei Stoß: ΔE = ${fe(dE_preview)} J wird in Wärme/Verformung umgewandelt`, 28, y0 + 108);

  } else {
    // ── Nach dem Stoß: Vorher/Nachher-Vergleich ───────────────
    const pre  = preCollision;
    const post = postCollision;
    const pVorGes  = pre.p1 + pre.p2;
    const EkVorGes = pre.Ek1 + pre.Ek2;

    // Titelzeile
    ctx.font = 'bold 11px monospace';
    ctx.fillStyle = '#336633';
    ctx.textAlign = 'center';
    ctx.fillText('✓ STOSS ERFOLGT – vollkommen unelastisch', W / 2, y0 + 16);

    ctx.textAlign = 'left';

    // VORHER-Spalte (links)
    ctx.font = '10px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('VOR dem Stoß:', 28, y0 + 34);
    ctx.font = 'bold 10px monospace';
    ctx.fillStyle = '#3366cc';
    ctx.fillText(`p₁ = ${f(pre.p1)} kg·m/s  Eₖ₁ = ${fe(pre.Ek1)} J`, 28, y0 + 50);
    ctx.fillStyle = '#cc4400';
    ctx.fillText(`p₂ = ${f(pre.p2)} kg·m/s  Eₖ₂ = ${fe(pre.Ek2)} J`, 28, y0 + 65);
    ctx.fillStyle = '#222';
    ctx.fillText(`p_ges = ${f(pVorGes)} kg·m/s`, 28, y0 + 80);
    ctx.fillText(`Eₖ_ges = ${fe(EkVorGes)} J`, 28, y0 + 95);

    // Trennpfeil
    ctx.fillStyle = '#666';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('→', W / 2, y0 + 72);

    // NACHHER-Spalte (rechts)
    ctx.font = '10px monospace';
    ctx.fillStyle = '#888';
    ctx.textAlign = 'left';
    ctx.fillText('NACH dem Stoß:', W / 2 + 28, y0 + 34);

    ctx.font = 'bold 10px monospace';
    // Gemeinsame Geschwindigkeitsformel
    ctx.fillStyle = '#336644';
    ctx.fillText(
      `v' = (${f(pre.p1)}+(${f(pre.p2)})) / ${post.mSum.toFixed(1)} = ${f(post.vPrime)} m/s`,
      W / 2 + 28, y0 + 50
    );
    // Impuls nach (erhalten!)
    ctx.fillStyle = '#222';
    ctx.fillText(
      `p_ges = ${post.mSum.toFixed(1)}·(${f(post.vPrime)}) = ${f(post.pNach)} kg·m/s  ✓`,
      W / 2 + 28, y0 + 65
    );
    // Energie nach
    ctx.fillText(
      `Eₖ_nach = ½·${post.mSum.toFixed(1)}·(${f(post.vPrime)})² = ${fe(post.EkNach)} J`,
      W / 2 + 28, y0 + 80
    );
    // Energieverlust rot hervorheben
    ctx.fillStyle = '#cc2200';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(
      `ΔE = ${fe(EkVorGes)} − ${fe(post.EkNach)} = ${fe(post.dE)} J → Wärme/Verformung`,
      W / 2 + 28, y0 + 95
    );

    // Impuls-Prüfung
    const pDiff = Math.abs(pVorGes - post.pNach);
    ctx.fillStyle = pDiff < 1e-9 ? '#336633' : '#cc0000';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(
      `Impuls: ${f(pVorGes)} = ${f(post.pNach)} kg·m/s  (Δp = ${pDiff.toExponential(1)})`,
      W / 2, y0 + 115
    );
  }
}

// ================================================================
// ZEICHNEN
// ================================================================
function render() {
  const W  = canvas.width;
  const cy = SIM_HEIGHT / 2;

  ctx.clearRect(0, 0, W, canvas.height);

  // Simulationsbereich
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, SIM_HEIGHT);

  // Button-Bereich
  const btnY = SIM_HEIGHT + INFO_HEIGHT;
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, btnY, W, BTN_HEIGHT);
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, btnY + BTN_HEIGHT); ctx.lineTo(W, btnY + BTN_HEIGHT); ctx.stroke();

  // Achse
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(W, cy);
  ctx.stroke();

  // Meterticks
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  const ticks = Math.ceil(W / (2 * PIXELS_PER_METER)) + 1;
  for (let m = -ticks; m <= ticks; m++) {
    const x = physToScreenX(m);
    if (x < 0 || x > W) continue;
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, cy - 5);
    ctx.lineTo(x, cy + 5);
    ctx.stroke();
    ctx.fillStyle = '#888';
    ctx.fillText(m + 'm', x, cy + 18);
  }

  // Zoom-Info
  ctx.fillStyle = '#bbb';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Zoom: ' + PIXELS_PER_METER.toFixed(0) + ' px/m', W - 8, 14);

  // Drag-Hinweis
  if (!running) {
    ctx.fillStyle = '#bbb';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('← Körper ziehen | Scroll = Zoom', 8, 14);
  }

  // Stoß-Label in Simulation
  if (collisionOccurred) {
    ctx.fillStyle = '#cc220033';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#cc2200';
    ctx.fillText('▲ verhakt ▲', W / 2, 28);
  }

  // Startparameter oben
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3366cc';
  ctx.fillText(
    `K1: m=${params.m1.toFixed(1)} kg  v₀=${params.v1 >= 0 ? '+' : ''}${params.v1.toFixed(2)} m/s`,
    W / 4, SIM_HEIGHT - 12
  );
  ctx.fillStyle = '#cc4400';
  ctx.fillText(
    `K2: m=${params.m2.toFixed(1)} kg  v₀=${params.v2 >= 0 ? '+' : ''}${params.v2.toFixed(2)} m/s`,
    3 * W / 4, SIM_HEIGHT - 12
  );

  // Körper zeichnen
  if (collisionOccurred) {
    // Verhakten Doppelkörper zeichnen
    drawMergedBody(body1, body2, cy);
  } else {
    drawBody(body1, '#3366cc', 'K1', cy);
    drawBody(body2, '#cc4400', 'K2', cy);
  }

  // Info-Panel & Buttons
  drawInfoPanel();
  layoutButtons();
  drawButton(btnSetM1, '#555577');
  drawButton(btnSetM2, '#775555');
  drawButton(btnStart, running ? '#886600' : '#336633');
  drawButton(btnReset, '#663333');
}

function drawBody(body, color, label, cy) {
  const cx = physToScreenX(body.position);
  const r  = mToPx(body.radius);

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy);

  ctx.fillStyle = '#000';
  ctx.font = '10px monospace';
  ctx.textBaseline = 'bottom';
  ctx.fillText(
    'm=' + body.mass.toFixed(1) + '  v=' + (body.velocity >= 0 ? '+' : '') + body.velocity.toFixed(2),
    cx, cy - r - 4
  );

  if (Math.abs(body.velocity) > 0.05) {
    const tipX = cx + body.velocity * 20;
    const dir  = body.velocity > 0 ? 1 : -1;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tipX, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tipX, cy);
    ctx.lineTo(tipX - dir * 8, cy - 5);
    ctx.lineTo(tipX - dir * 8, cy + 5);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
}

// Verhakter Doppelkörper: zwei Kreise überlappend
function drawMergedBody(b1, b2, cy) {
  // Nach Stoß: beide an gleicher Position (Mittelpunkt)
  const cx = physToScreenX(b1.position);
  const r  = mToPx(b1.radius);
  const v  = b1.velocity;

  // Linker Kreis (K1, blau)
  ctx.beginPath();
  ctx.arc(cx - r * 0.55, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#3366cc';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Rechter Kreis (K2, rot), leicht überlappend
  ctx.beginPath();
  ctx.arc(cx + r * 0.55, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = '#cc4400';
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Zackige Verbindung (verhakt)
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const midX = cx;
  ctx.moveTo(midX - 6, cy - 8);
  ctx.lineTo(midX + 3, cy - 3);
  ctx.lineTo(midX - 3, cy + 3);
  ctx.lineTo(midX + 6, cy + 8);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('K1', cx - r * 0.55, cy);
  ctx.fillText('K2', cx + r * 0.55, cy);

  // Gemeinsame Geschwindigkeit & Masse
  ctx.fillStyle = '#000';
  ctx.font = '10px monospace';
  ctx.textBaseline = 'bottom';
  const mSum = b1.mass + b2.mass;
  ctx.fillText(
    `m=${mSum.toFixed(1)} kg  v'=${v >= 0 ? '+' : ''}${v.toFixed(3)} m/s`,
    cx, cy - r - 4
  );

  // Geschwindigkeitspfeil
  if (Math.abs(v) > 0.02) {
    const tipX = cx + v * 20;
    const dir  = v > 0 ? 1 : -1;
    ctx.strokeStyle = '#663300';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tipX, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tipX, cy);
    ctx.lineTo(tipX - dir * 8, cy - 5);
    ctx.lineTo(tipX - dir * 8, cy + 5);
    ctx.closePath();
    ctx.fillStyle = '#663300';
    ctx.fill();
  } else {
    // Zeige "v' ≈ 0"
    ctx.fillStyle = '#cc2200';
    ctx.font = 'bold 11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText("v' ≈ 0  (Ruhe)", cx, cy + r + 4);
  }
}

// ================================================================
// ANIMATIONS-LOOP
// ================================================================
let running  = false;
let lastTime = null;

function loop(timestamp) {
  if (!running) return;
  if (lastTime !== null) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    simulationStep(dt);
  }
  lastTime = timestamp;
  render();
  requestAnimationFrame(loop);
}

// ================================================================
// BUTTON-AKTIONEN
// ================================================================
function startSim() {
  running  = true;
  lastTime = null;
  btnStart.label = 'Pause';
  requestAnimationFrame(loop);
}

function pauseSim() {
  running  = false;
  lastTime = null;
  btnStart.label = 'Start';
  render();
}

function resetSim() {
  running  = false;
  lastTime = null;
  btnStart.label = 'Start';
  body1 = createBody(params.m1, body1.initPos, params.v1);
  body2 = createBody(params.m2, body2.initPos, params.v2);
  collisionProcessed = false;
  collisionOccurred  = false;
  preCollision  = null;
  postCollision = null;
  render();
}

function askSetParams(bodyNum) {
  const oldM = bodyNum === 1 ? params.m1 : params.m2;
  const oldV = bodyNum === 1 ? params.v1 : params.v2;
  const mStr = prompt(`Masse K${bodyNum} (kg, aktuell: ${oldM}):`, oldM);
  if (mStr === null) return;
  const vStr = prompt(`Startgeschwindigkeit K${bodyNum} (m/s, aktuell: ${oldV}):`, oldV);
  if (vStr === null) return;
  const m = parseFloat(mStr);
  const v = parseFloat(vStr);
  if (isNaN(m) || m <= 0 || isNaN(v)) { alert('Ungültige Eingabe!'); return; }
  if (bodyNum === 1) setParams(m, v, params.m2, params.v2);
  else               setParams(params.m1, params.v1, m, v);
  body1 = createBody(params.m1, body1.initPos, params.v1);
  body2 = createBody(params.m2, body2.initPos, params.v2);
  collisionProcessed = false;
  collisionOccurred  = false;
  preCollision  = null;
  postCollision = null;
  render();
}

// ================================================================
// MAUS-EVENTS
// ================================================================
let dragging = null;

function getCanvasPos(e) {
  const rect   = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top)  * scaleY
  };
}

function isOnBody(body, mx, my) {
  const cy = SIM_HEIGHT / 2;
  const cx = physToScreenX(body.position);
  const r  = mToPx(body.radius);
  return Math.hypot(mx - cx, my - cy) <= r;
}

// Nach Stoß: auf den gemeinsamen Körper klicken
function isOnMergedBody(mx, my) {
  if (!collisionOccurred) return false;
  const cy = SIM_HEIGHT / 2;
  const cx = physToScreenX(body1.position);
  const r  = mToPx(body1.radius) + mToPx(body1.radius) * 0.55;
  return Math.hypot(mx - cx, my - cy) <= r;
}

canvas.addEventListener('mousedown', (e) => {
  const { x, y } = getCanvasPos(e);
  if (isInsideButton(btnStart, x, y))  { running ? pauseSim() : startSim(); return; }
  if (isInsideButton(btnReset, x, y))  { resetSim(); return; }
  if (isInsideButton(btnSetM1, x, y))  { askSetParams(1); return; }
  if (isInsideButton(btnSetM2, x, y))  { askSetParams(2); return; }
  if (!running && !collisionOccurred) {
    if      (isOnBody(body1, x, y)) { dragging = 'body1'; canvas.style.cursor = 'grabbing'; }
    else if (isOnBody(body2, x, y)) { dragging = 'body2'; canvas.style.cursor = 'grabbing'; }
  }
  if (!running && collisionOccurred && isOnMergedBody(x, y)) {
    dragging = 'merged';
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!dragging) {
    const { x, y } = getCanvasPos(e);
    const onBody = !running && (isOnBody(body1, x, y) || isOnBody(body2, x, y) || isOnMergedBody(x, y));
    canvas.style.cursor = onBody ? 'grab' : 'default';
    return;
  }
  const { x } = getCanvasPos(e);
  const newPhysX = screenToPhysX(x);

  if (dragging === 'merged') {
    // Nach Stoß: verbundener Körper verschieben
    body1.position = newPhysX;
    body2.position = newPhysX;
    body1.initPos  = newPhysX;
    body2.initPos  = newPhysX;
    render();
    return;
  }

  const body  = dragging === 'body1' ? body1 : body2;
  const other = dragging === 'body1' ? body2 : body1;
  const minDist = body.radius + other.radius + 0.05;

  if (dragging === 'body1') body.position = Math.min(newPhysX, other.position - minDist);
  else                      body.position = Math.max(newPhysX, other.position + minDist);
  body.initPos = body.position;
  render();
});

canvas.addEventListener('mouseup',    () => { dragging = null; canvas.style.cursor = 'default'; });
canvas.addEventListener('mouseleave', () => { dragging = null; canvas.style.cursor = 'default'; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  PIXELS_PER_METER = Math.max(MIN_SCALE, Math.min(MAX_SCALE,
    PIXELS_PER_METER + (e.deltaY > 0 ? -8 : 8)));
  render();
}, { passive: false });

// ================================================================
// INIT
// ================================================================
render();
