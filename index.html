<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physik – Kursübersicht</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #13161e;
      --border:    #1f2330;
      --accent:    #4f7eff;
      --accent2:   #8b5cf6;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --card-h:    320px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }

    header h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin: 1.5rem auto 0;
      border-radius: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 360px));
      gap: 1.5rem;
      justify-content: center;
      width: 100%;
      max-width: 800px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: var(--card-h);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 0 30px rgba(79, 126, 255, 0.15);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Decorative physics grid background */
    .card-bg {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 28px 28px;
      transition: opacity 0.25s ease;
    }
    .card:hover .card-bg { opacity: 0.14; }

    /* Glow orb */
    .card-orb {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      top: -50px;
      right: -50px;
      opacity: 0.18;
      filter: blur(55px);
      transition: opacity 0.35s ease;
    }
    .card:hover .card-orb { opacity: 0.32; }

    .card-1 .card-orb { background: var(--accent); }
    .card-2 .card-orb { background: var(--accent2); }

    /* Year badge in top-left */
    .card-year {
      position: absolute;
      top: 1.2rem;
      left: 1.4rem;
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Atom icon */
    .card-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      opacity: 0.12;
      transition: opacity 0.25s ease;
    }
    .card:hover .card-icon { opacity: 0.2; }

    .card-icon svg { width: 90px; height: 90px; }

    /* Bottom content */
    .card-body {
      position: relative;
      z-index: 1;
      padding: 1.4rem 1.6rem 1.6rem;
      background: linear-gradient(to top, rgba(13,15,20,0.95) 60%, transparent);
    }

    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .card-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .card-arrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--accent);
      transition: gap 0.2s ease;
    }
    .card-2 .card-arrow { color: var(--accent2); }
    .card:hover .card-arrow { gap: 0.7rem; }

    footer {
      margin-top: 3.5rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .card-bg, .card-orb, .card-icon, .card-arrow { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">Thomas Mann Schule · Physik</p>
    <h1>Kurs<span>übersicht</span></h1>
    <div class="divider"></div>
  </header>

  <div class="grid">

    <!-- Card 1 -->
    <a href="alteSeiten/index.html" class="card card-1">

      <div class="card-icon">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">

          <ellipse cx="50" cy="50" rx="48" ry="18" stroke="white" stroke-width="2" transform="rotate(120 50 50)"/>

    <a href="Physite/Mint/Hub_Mainpage/Hub_Lernseite_Mint.php" class="card card-2">

          <ellipse cx="50" cy="50" rx="48" ry="18" stroke="white" stroke-width="2" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="48" ry="18" stroke="white" stroke-width="2" transform="rotate(120 50 50)"/>
          <circle cx="50" cy="50" r="6" fill="white"/>

      </div>

      <div class="card-body">
        <p class="card-title">Physikprofil<br>24 – 27</p>
        <p class="card-sub">Aktuelle Kursseite · MINT-Hub</p>
        <span class="card-arrow">Zur Seite →</span>

  </div>

  <footer>Thomas Mann Schule · Physik</footer>

</body>
</html>
