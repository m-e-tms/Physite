<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
   <link rel="stylesheet" href="../../scripts/test.css">
   
</head>
<body>
 <div class="card">
        <div class="widget">
    <h1>Elastischer Stoß</h1>
           
<canvas id="myCanvas" width="1920px" height="1080px"></canvas>
 </div>

<script>
const canvas = document.getElementById('myCanvas');
const ctx    = canvas.getContext('2d');

canvas.width  = 800;
canvas.height = 480;

// ================================================================
// KONSTANTEN & ZOOM
// ================================================================
let PIXELS_PER_METER = 80;
const RADIUS_M  = 0.30;
const MIN_SCALE = 30;
const MAX_SCALE = 250;

const SIM_HEIGHT  = 220;
const INFO_HEIGHT = 110;
const BTN_HEIGHT  = 60;
// Gesamthöhe = 390, aber wir nutzen 480 → etwas Puffer

// ================================================================
// PHYSIK
// ================================================================
function createBody(mass, position, velocity) {
  return { mass, position, velocity,
           initPos: position, initVel: velocity, radius: RADIUS_M };
}

function updatePosition(body, dt) {
  body.position += body.velocity * dt;
}

function isColliding(b1, b2) {
  return Math.abs(b2.position - b1.position) <= b1.radius + b2.radius;
}

function areApproaching(b1, b2) {
  // b1 links, b2 rechts: Annäherung wenn b1 schneller nach rechts als b2
  return (b2.velocity - b1.velocity) * (b2.position - b1.position) < 0;
}

function applyElasticCollision(b1, b2) {
  const m1 = b1.mass, m2 = b2.mass;
  const v1 = b1.velocity, v2 = b2.velocity;
  const mSum = m1 + m2;
  // Elastische Stoßformeln (korrekt):
  b1.velocity = ((m1 - m2) / mSum) * v1 + (2 * m2 / mSum) * v2;
  b2.velocity = (2 * m1 / mSum) * v1 + ((m2 - m1) / mSum) * v2;
}

function momentum(b)      { return b.mass * b.velocity; }
function kineticEnergy(b) { return 0.5 * b.mass * b.velocity ** 2; }

// ================================================================
// KOORDINATENUMRECHNUNG
// ================================================================
function physToScreenX(physX) {
  return canvas.width / 2 + physX * PIXELS_PER_METER;
}

function screenToPhysX(screenX) {
  return (screenX - canvas.width / 2) / PIXELS_PER_METER;
}

function mToPx(meters) {
  return meters * PIXELS_PER_METER;
}

// ================================================================
// MODELL – Parameter intern verwaltet
// ================================================================
let params = { m1: 1.0, v1: 2.0, m2: 1.0, v2: -1.0 };

let body1 = createBody(params.m1, -3.0, params.v1);
let body2 = createBody(params.m2,  3.0, params.v2);
let collisionProcessed = false;

function setParams(m1, v1, m2, v2) {
  params = { m1, v1, m2, v2 };
  body1 = createBody(m1, body1.initPos, v1);
  body2 = createBody(m2, body2.initPos, v2);
  collisionProcessed = false;
}

// ================================================================
// SIMULATIONS-UPDATE
// ================================================================
function simulationStep(dt) {
  updatePosition(body1, dt);
  updatePosition(body2, dt);

  if (isColliding(body1, body2)) {
    if (!collisionProcessed && areApproaching(body1, body2)) {
      applyElasticCollision(body1, body2);
      collisionProcessed = true;
    }
  } else {
    collisionProcessed = false;
  }
}

// ================================================================
// CANVAS BUTTONS
// ================================================================
const btnStart  = { label: 'Start',    x: 0, y: 0, w: 110, h: 34 };
const btnReset  = { label: 'Reset',    x: 0, y: 0, w: 110, h: 34 };
const btnSetM1  = { label: 'm₁ setzen', x: 0, y: 0, w: 110, h: 34 };
const btnSetM2  = { label: 'm₂ setzen', x: 0, y: 0, w: 110, h: 34 };

function layoutButtons() {
  const cy = SIM_HEIGHT + INFO_HEIGHT + BTN_HEIGHT / 2;
  const totalW = 4 * 110 + 3 * 12;
  let startX = (canvas.width - totalW) / 2;

  btnSetM1.x = startX;            btnSetM1.y = cy - 17;
  btnSetM2.x = startX + 122;      btnSetM2.y = cy - 17;
  btnStart.x  = startX + 244;     btnStart.y  = cy - 17;
  btnReset.x  = startX + 366;     btnReset.y  = cy - 17;
}

function drawButton(btn, bgColor) {
  ctx.fillStyle = bgColor;
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 5);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
}

function isInsideButton(btn, mx, my) {
  return mx >= btn.x && mx <= btn.x + btn.w &&
         my >= btn.y && my <= btn.y + btn.h;
}

// ================================================================
// INFO-PANEL: Messwerte + Formeln im Canvas
// ================================================================
function drawInfoPanel() {
  const y0 = SIM_HEIGHT;
  const W  = canvas.width;

  // Hintergrund
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, y0, W, INFO_HEIGHT);

  // Trennlinien
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, y0 + INFO_HEIGHT); ctx.lineTo(W, y0 + INFO_HEIGHT); ctx.stroke();

  const p1    = momentum(body1);
  const p2    = momentum(body2);
  const ptot  = p1 + p2;
  const Ek1   = kineticEnergy(body1);
  const Ek2   = kineticEnergy(body2);
  const Ektot = Ek1 + Ek2;

  const f  = v => (v >= 0 ? '+' : '') + v.toFixed(3);
  const fe = v => v.toFixed(3);

  // ---- Zeile 1: Formeln (grau) ----
  const yF = y0 + 18;
  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'left';

  // Formelzeile
  const formulas = [
    { x: 28,  text: 'p = m·v' },
    { x: 168, text: 'p_ges = p₁+p₂' },
    { x: 340, text: 'Eₖ = ½·m·v²' },
    { x: 490, text: 'Eₖ_ges = Eₖ₁+Eₖ₂' },
  ];
  formulas.forEach(f => {
    ctx.fillStyle = '#aaa';
    ctx.fillText(f.text, f.x, yF);
  });

  // ---- Zeile 2: Werte K1 ----
  const yV1 = y0 + 40;
  ctx.font = 'bold 11px monospace';

  drawColored('#3366cc', 28,  yV1, `p₁ = ${body1.mass.toFixed(1)}·(${f(body1.velocity)}) = ${f(p1)} kg·m/s`);
  drawColored('#3366cc', 340, yV1, `Eₖ₁ = ½·${body1.mass.toFixed(1)}·(${f(body1.velocity)})² = ${fe(Ek1)} J`);

  // ---- Zeile 3: Werte K2 ----
  const yV2 = y0 + 60;
  drawColored('#cc4400', 28,  yV2, `p₂ = ${body2.mass.toFixed(1)}·(${f(body2.velocity)}) = ${f(p2)} kg·m/s`);
  drawColored('#cc4400', 340, yV2, `Eₖ₂ = ½·${body2.mass.toFixed(1)}·(${f(body2.velocity)})² = ${fe(Ek2)} J`);

  // ---- Zeile 4: Gesamtwerte ----
  const yVt = y0 + 82;
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = '#222';
  ctx.fillText(`p_ges = ${f(p1)} + (${f(p2)}) = ${f(ptot)} kg·m/s`, 28, yVt);
  ctx.fillText(`Eₖ_ges = ${fe(Ek1)} + ${fe(Ek2)} = ${fe(Ektot)} J`, 340, yVt);

  // Trennlinie vertikal
  ctx.strokeStyle = '#ddd';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2, y0 + 8);
  ctx.lineTo(W / 2, y0 + INFO_HEIGHT - 8);
  ctx.stroke();

  function drawColored(color, x, y, text) {
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }
}

// ================================================================
// ZEICHNEN
// ================================================================
function render() {
  const W  = canvas.width;
  const cy = SIM_HEIGHT / 2;

  ctx.clearRect(0, 0, W, canvas.height);

  // --- Simulationsbereich ---
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, SIM_HEIGHT);

  // --- Button-Bereich ---
  const btnY = SIM_HEIGHT + INFO_HEIGHT;
  ctx.fillStyle = '#e8e8e8';
  ctx.fillRect(0, btnY, W, BTN_HEIGHT);
  ctx.strokeStyle = '#ccc';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, btnY + BTN_HEIGHT); ctx.lineTo(W, btnY + BTN_HEIGHT); ctx.stroke();

  // --- Achse ---
  ctx.strokeStyle = '#bbb';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, cy);
  ctx.lineTo(W, cy);
  ctx.stroke();

  // --- Meterticks ---
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  const ticks = Math.ceil(W / (2 * PIXELS_PER_METER)) + 1;
  for (let m = -ticks; m <= ticks; m++) {
    const x = physToScreenX(m);
    if (x < 0 || x > W) continue;
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, cy - 5);
    ctx.lineTo(x, cy + 5);
    ctx.stroke();
    ctx.fillStyle = '#888';
    ctx.fillText(m + 'm', x, cy + 18);
  }

  // --- Zoom-Info ---
  ctx.fillStyle = '#bbb';
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Zoom: ' + PIXELS_PER_METER.toFixed(0) + ' px/m  |  Rad: ' + RADIUS_M + ' m', W - 8, 14);

  // --- Hinweis ---
  if (!running) {
    ctx.fillStyle = '#bbb';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('← Körper ziehen | Scroll = Zoom', 8, 14);
  }

  // --- Parameter-Anzeige oben ---
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#3366cc';
  ctx.fillText(`K1: m=${params.m1.toFixed(1)} kg  v₀=${params.v1 >= 0 ? '+' : ''}${params.v1.toFixed(2)} m/s`, W / 4, SIM_HEIGHT - 12);
  ctx.fillStyle = '#cc4400';
  ctx.fillText(`K2: m=${params.m2.toFixed(1)} kg  v₀=${params.v2 >= 0 ? '+' : ''}${params.v2.toFixed(2)} m/s`, 3 * W / 4, SIM_HEIGHT - 12);

  // --- Körper ---
  drawBody(body1, '#3366cc', 'K1', cy);
  drawBody(body2, '#cc4400', 'K2', cy);

  // --- Info-Panel ---
  drawInfoPanel();

  // --- Buttons ---
  layoutButtons();
  drawButton(btnSetM1, '#555577');
  drawButton(btnSetM2, '#775555');
  drawButton(btnStart, running ? '#886600' : '#336633');
  drawButton(btnReset, '#663333');
}

function drawBody(body, color, label, cy) {
  const cx = physToScreenX(body.position);
  const r  = mToPx(body.radius);

  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy);

  ctx.fillStyle = '#000';
  ctx.font = '10px monospace';
  ctx.textBaseline = 'bottom';
  ctx.fillText(
    'm=' + body.mass.toFixed(1) + '  v=' + (body.velocity >= 0 ? '+' : '') + body.velocity.toFixed(2),
    cx, cy - r - 4
  );

  // Geschwindigkeitspfeil
  if (Math.abs(body.velocity) > 0.05) {
    const tipX = cx + body.velocity * 20;
    const dir  = body.velocity > 0 ? 1 : -1;
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(tipX, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(tipX, cy);
    ctx.lineTo(tipX - dir * 8, cy - 5);
    ctx.lineTo(tipX - dir * 8, cy + 5);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }
}

// ================================================================
// ANIMATIONS-LOOP
// ================================================================
let running  = false;
let lastTime = null;

function loop(timestamp) {
  if (!running) return;
  if (lastTime !== null) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
    simulationStep(dt);
  }
  lastTime = timestamp;
  render();
  requestAnimationFrame(loop);
}

// ================================================================
// BUTTON-AKTIONEN
// ================================================================
function startSim() {
  running  = true;
  lastTime = null;
  btnStart.label = 'Pause';
  requestAnimationFrame(loop);
}

function pauseSim() {
  running  = false;
  lastTime = null;
  btnStart.label = 'Start';
  render();
}

function resetSim() {
  running  = false;
  lastTime = null;
  btnStart.label = 'Start';
  body1 = createBody(params.m1, body1.initPos, params.v1);
  body2 = createBody(params.m2, body2.initPos, params.v2);
  collisionProcessed = false;
  render();
}

function askSetParams(bodyNum) {
  const oldM = bodyNum === 1 ? params.m1 : params.m2;
  const oldV = bodyNum === 1 ? params.v1 : params.v2;
  const mStr = prompt(`Masse K${bodyNum} (kg, aktuell: ${oldM}):`, oldM);
  if (mStr === null) return;
  const vStr = prompt(`Startgeschwindigkeit K${bodyNum} (m/s, aktuell: ${oldV}):`, oldV);
  if (vStr === null) return;
  const m = parseFloat(mStr);
  const v = parseFloat(vStr);
  if (isNaN(m) || m <= 0 || isNaN(v)) { alert('Ungültige Eingabe!'); return; }
  if (bodyNum === 1) setParams(m, v, params.m2, params.v2);
  else               setParams(params.m1, params.v1, m, v);
  // Startpositionen beibehalten, Simulation neu initialisieren
  body1 = createBody(params.m1, body1.initPos, params.v1);
  body2 = createBody(params.m2, body2.initPos, params.v2);
  collisionProcessed = false;
  render();
}

// ================================================================
// MAUS-EVENTS
// ================================================================
let dragging = null;

function getCanvasPos(e) {
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top)  * scaleY
  };
}

function isOnBody(body, mx, my) {
  const cy = SIM_HEIGHT / 2;
  const cx = physToScreenX(body.position);
  const r  = mToPx(body.radius);
  return Math.hypot(mx - cx, my - cy) <= r;
}

canvas.addEventListener('mousedown', (e) => {
  const { x, y } = getCanvasPos(e);

  if (isInsideButton(btnStart, x, y))  { running ? pauseSim() : startSim(); return; }
  if (isInsideButton(btnReset, x, y))  { resetSim(); return; }
  if (isInsideButton(btnSetM1, x, y))  { askSetParams(1); return; }
  if (isInsideButton(btnSetM2, x, y))  { askSetParams(2); return; }

  if (!running) {
    if      (isOnBody(body1, x, y)) { dragging = 'body1'; canvas.style.cursor = 'grabbing'; }
    else if (isOnBody(body2, x, y)) { dragging = 'body2'; canvas.style.cursor = 'grabbing'; }
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!dragging) {
    const { x, y } = getCanvasPos(e);
    canvas.style.cursor = (!running && (isOnBody(body1, x, y) || isOnBody(body2, x, y)))
      ? 'grab' : 'default';
    return;
  }
  const { x } = getCanvasPos(e);
  const newPhysX = screenToPhysX(x);
  const body  = dragging === 'body1' ? body1 : body2;
  const other = dragging === 'body1' ? body2 : body1;
  const minDist = body.radius + other.radius + 0.05;

  if (dragging === 'body1') body.position = Math.min(newPhysX, other.position - minDist);
  else                      body.position = Math.max(newPhysX, other.position + minDist);

  body.initPos = body.position;
  render();
});

canvas.addEventListener('mouseup',    () => { dragging = null; canvas.style.cursor = 'default'; });
canvas.addEventListener('mouseleave', () => { dragging = null; canvas.style.cursor = 'default'; });

// ================================================================
// ZOOM
// ================================================================
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  PIXELS_PER_METER = Math.max(MIN_SCALE, Math.min(MAX_SCALE,
    PIXELS_PER_METER + (e.deltaY > 0 ? -8 : 8)));
  render();
}, { passive: false });

// ================================================================
// INIT
// ================================================================
render();
</script>

    </div>
</div>
